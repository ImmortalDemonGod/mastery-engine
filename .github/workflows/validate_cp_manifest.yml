name: CP Accelerator - Manifest Integrity Check

on:
  pull_request:
    paths:
      - 'curricula/cp_accelerator/**'
      - 'scripts/generate_manifest.py'
  push:
    branches:
      - main
    paths:
      - 'curricula/cp_accelerator/**'

jobs:
  validate-manifest:
    name: Validate Manifest Integrity
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install uv
        run: pip install uv
      
      - name: Create cs336_basics symlink (required for package install)
        run: |
          echo "Creating cs336_basics symlink for CI..."
          ln -s modes/student/cs336_basics cs336_basics
      
      - name: Install dependencies
        run: uv sync
      
      - name: Validate canonical curriculum
        run: |
          echo "🔍 Validating canonical_curriculum.json..."
          uv run python scripts/generate_manifest.py --validate-only
      
      - name: Regenerate manifest from canonical source
        run: |
          echo "🏗️  Regenerating manifest.json from canonical source..."
          uv run python scripts/generate_manifest.py
      
      - name: Check for manual manifest edits (FORBIDDEN)
        run: |
          echo "🔒 Checking manifest integrity..."
          if git diff --exit-code curricula/cp_accelerator/manifest.json; then
            echo "✅ PASS: manifest.json is in sync with canonical_curriculum.json"
          else
            echo "❌ FAIL: manifest.json has been manually edited!"
            echo ""
            echo "The manifest.json file MUST be generated from canonical_curriculum.json."
            echo ""
            echo "To fix this:"
            echo "  1. Revert manual changes to manifest.json"
            echo "  2. Update curricula/cp_accelerator/canonical_curriculum.json instead"
            echo "  3. Run: uv run python scripts/generate_manifest.py"
            echo "  4. Commit both canonical_curriculum.json AND the generated manifest.json"
            echo ""
            echo "Diff of unauthorized changes:"
            git diff curricula/cp_accelerator/manifest.json
            exit 1
          fi
      
      - name: Verify module directories exist
        run: |
          echo "📂 Verifying module directory structure..."
          MODULE_ERRORS=0
          
          # Read problem IDs from manifest
          PROBLEM_IDS=$(python -c "
          import json
          with open('curricula/cp_accelerator/manifest.json') as f:
              manifest = json.load(f)
              # In library mode, iterate patterns then problems
              if 'patterns' in manifest:
                  for pattern in manifest['patterns']:
                      for problem in pattern['problems']:
                          # Format as pattern_id/problem_id for directory check
                          print(f\"{pattern['id']}:{problem['id']}:{problem['path']}\")
          ")
          
          for entry in $PROBLEM_IDS; do
            # Parse entry
            pattern_id=$(echo $entry | cut -d: -f1)
            problem_id=$(echo $entry | cut -d: -f2)
            problem_path=$(echo $entry | cut -d: -f3)
            
            module_dir="curricula/cp_accelerator/$problem_path"
            if [ ! -d "$module_dir" ]; then
              echo "⚠️  WARNING: Problem directory missing: $module_dir"
              MODULE_ERRORS=$((MODULE_ERRORS + 1))
            else
              echo "✓ $pattern_id/$problem_id"
            fi
          done
          
          if [ $MODULE_ERRORS -gt 0 ]; then
            echo ""
            echo "⚠️  $MODULE_ERRORS problem directories are missing"
            echo "   This is a warning (not a failure) during curriculum development"
          else
            echo ""
            echo "✅ All problem directories exist"
          fi

  schema-validation:
    name: Validate JSON Schemas
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Validate canonical_curriculum.json structure
        run: |
          echo "🔍 Validating canonical_curriculum.json structure..."
          python -c "
          import json
          import sys
          
          required_fields = ['version', 'last_updated', 'sources', 'topics']
          topic_required_fields = ['id', 'name', 'rating_bracket', 'priority', 
                                   'taxonomy_path', 'description', 'dependencies']
          
          try:
              with open('curricula/cp_accelerator/canonical_curriculum.json') as f:
                  data = json.load(f)
              
              # Check top-level fields
              for field in required_fields:
                  if field not in data:
                      print(f'❌ Missing required field: {field}')
                      sys.exit(1)
              
              # Check each topic
              for i, topic in enumerate(data['topics']):
                  for field in topic_required_fields:
                      if field not in topic:
                          print(f'❌ Topic {i} ({topic.get(\"id\", \"unknown\")}) missing field: {field}')
                          sys.exit(1)
              
              print(f'✅ Canonical curriculum structure valid ({len(data[\"topics\"])} topics)')
          except json.JSONDecodeError as e:
              print(f'❌ JSON syntax error: {e}')
              sys.exit(1)
          except Exception as e:
              print(f'❌ Validation error: {e}')
              sys.exit(1)
          "
      
      - name: Validate manifest.json against engine schema
        run: |
          echo "🔍 Validating manifest.json against Mastery Engine schema..."
          python -c "
          import json
          import sys
          
          try:
              with open('curricula/cp_accelerator/manifest.json') as f:
                  manifest = json.load(f)
              
              # Check required fields for LIBRARY mode
              required = ['curriculum_name', 'author', 'version', 'type', 'patterns']
              for field in required:
                  if field not in manifest:
                      print(f'❌ Missing required field: {field}')
                      sys.exit(1)
              
              if manifest['type'] != 'library':
                  print(f'❌ Expected type \"library\", got \"{manifest.get(\"type\")}\"')
                  sys.exit(1)
              
              # Check patterns structure
              for pattern in manifest['patterns']:
                  if 'id' not in pattern or 'title' not in pattern or 'problems' not in pattern:
                      print(f'❌ Pattern missing required fields: {pattern.get(\"id\", \"unknown\")}')
                      sys.exit(1)
                  
                  for problem in pattern['problems']:
                      if 'id' not in problem or 'title' not in problem or 'path' not in problem:
                          print(f'❌ Problem missing required fields: {problem.get(\"id\", \"unknown\")} in {pattern[\"id\"]}')
                          sys.exit(1)
              
              print(f'✅ Manifest structure valid ({len(manifest[\"patterns\"])} patterns)')
          except Exception as e:
              print(f'❌ Validation error: {e}')
              sys.exit(1)
          "

  dependency-graph-analysis:
    name: Analyze Dependency Graph
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Generate dependency graph report
        run: |
          echo "📊 Generating dependency graph analysis..."
          python -c "
          import json
          from collections import defaultdict
          
          with open('curricula/cp_accelerator/manifest.json') as f:
              manifest = json.load(f)
          
          # In library mode, dependencies are between patterns
          patterns = manifest.get('patterns', [])
          
          # Build reverse dependency map
          dependents = defaultdict(list)
          for pattern in patterns:
              # Metadata contains dependencies in this curriculum structure
              deps = pattern.get('metadata', {}).get('dependencies', [])
              for dep in deps:
                  dependents[dep].append(pattern['id'])
          
          # Find root nodes (no dependencies)
          roots = [p['id'] for p in patterns if not p.get('metadata', {}).get('dependencies')]
          
          # Find leaf nodes (no dependents)
          all_ids = {p['id'] for p in patterns}
          leaves = [pid for pid in all_ids if not dependents[pid]]
          
          print(f'📈 Dependency Graph Statistics (Patterns):')
          print(f'   Total patterns: {len(patterns)}')
          print(f'   Root patterns (no dependencies): {len(roots)}')
          print(f'     {roots}')
          print(f'   Leaf patterns (nothing depends on them): {len(leaves)}')
          print(f'     {leaves}')
          print(f'')
          print(f'✅ Dependency graph analysis complete')
          "
